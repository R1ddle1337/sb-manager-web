<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>节点编辑 · sb-manager</title><link rel="stylesheet" href="/static/app.css"></head>
<body class="detail-body" data-server-id="{{.ServerID}}" data-node-id="{{.NodeID}}"><main class="detail-shell"><header class="detail-header"><a href="/">← 返回总览</a><a id="server-link">服务器详情 →</a></header><section class="detail-title"><p class="eyebrow">NODE EDITOR</p><h1 id="node-title">节点</h1><p class="muted">修改会提交给目标服务器的 sb-manager 事务，并经过 check 与回滚。</p></section><section id="alerts" aria-live="polite"></section><section class="panel"><form id="node-edit-form" class="form-grid detail-form"><label>节点名称<input name="name" placeholder="节点名称"></label><label>端口<input name="port" type="number" min="1" max="65535" required></label><label>服务器地址<input name="address" placeholder="edge.example.com"></label><label>域名<input name="domain" placeholder="example.com"></label><label>备注<input name="remark" placeholder="备注"></label><label>地区<input name="region" placeholder="地区"></label><label>用途<input name="purpose" placeholder="用途"></label><label>线路<input name="line" placeholder="线路"></label><label>标签<input name="tags" placeholder="a,b"></label><details class="subsection protocol-options"><summary>协议专属与 sing-box 1.14 字段</summary><p class="muted field-hint">读取当前节点后可编辑对应字段；不适用字段保持为空。</p><div class="advanced-grid"><label>SS method<select name="method"><option value="">不修改</option><option value="2022-blake3-aes-256-gcm">2022-blake3-aes-256-gcm</option><option value="2022-blake3-aes-128-gcm">2022-blake3-aes-128-gcm</option><option value="2022-blake3-chacha20-poly1305">2022-blake3-chacha20-poly1305</option></select></label><label>WebSocket path<input name="path"></label><label>网络<select name="network"><option value="">不修改</option><option value="tcp">TCP</option><option value="udp">UDP</option></select></label><label>HY2/Snell obfs<select name="obfs"><option value="">不修改</option><option value="salamander">salamander</option><option value="gecko">gecko</option><option value="none">none</option><option value="http">http</option></select></label><label>obfs Host<input name="obfs_host"></label><label>Gecko 最小包长<input name="obfs_min_packet_size" type="number" min="64" max="1500"></label><label>Gecko 最大包长<input name="obfs_max_packet_size" type="number" min="64" max="1500"></label><label>BBR profile<select name="bbr_profile"><option value="">不修改</option><option value="conservative">conservative</option><option value="standard">standard</option><option value="aggressive">aggressive</option></select></label><label>伪装 URL<input name="masquerade"></label><label>VLESS security<select name="security"><option value="">不修改</option><option value="tls">tls</option><option value="reality">reality</option></select></label><label>VLESS flow<input name="flow"></label><label>握手服务器<input name="handshake_server"></label><label>握手端口<input name="handshake_port" type="number" min="1" max="65535"></label><label>拥塞控制<select name="congestion_control"><option value="">不修改</option><option value="cubic">cubic</option><option value="new_reno">new_reno</option><option value="bbr">bbr</option></select></label><label>严格模式<select name="strict_mode"><option value="">不修改</option><option value="true">true</option><option value="false">false</option></select></label><label>Wildcard SNI<select name="wildcard_sni"><option value="">不修改</option><option value="off">off</option><option value="authed">authed</option><option value="all">all</option></select></label><label>Snell 版本<select name="snell_version"><option value="">不修改</option><option value="5">5</option><option value="6">6</option></select></label><label>Snell 模式<select name="snell_mode"><option value="">不修改</option><option value="default">default</option><option value="unshaped">unshaped</option><option value="unsafe-raw">unsafe-raw</option></select></label><label>Realm ID<input name="realm_id"></label><label>Realm IP<select name="realm_ip_version"><option value="">不修改</option><option value="0">0</option><option value="4">4</option><option value="6">6</option></select></label><label class="checkbox-field"><input name="disable_chrome_parrot" type="checkbox">关闭 Chrome 指纹</label><label class="checkbox-field"><input name="brutal_debug" type="checkbox">Brutal debug</label><label class="checkbox-field"><input name="realm_port_mapping" type="checkbox">Realm 端口映射</label></div></details><div class="form-actions"><button type="submit" class="primary-button">保存节点</button><a class="secondary-button" id="share-link">查看分享</a></div></form><pre id="node-output" class="output detail-output">读取中…</pre></section></main><script src="/static/detail.js" defer></script></body></html>
