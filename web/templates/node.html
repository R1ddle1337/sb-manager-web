<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>节点编辑 · sb-manager</title><link rel="stylesheet" href="/static/app.css"></head>
<body class="detail-body"><main class="detail-shell"><header class="detail-header"><a href="/">← 返回总览</a><a id="server-link">服务器详情 →</a></header><section class="detail-title"><p class="eyebrow">NODE EDITOR</p><h1 id="node-title">节点</h1><p class="muted">修改会提交给目标服务器的 sb-manager 事务，并经过 check 与回滚。</p></section><section id="alerts" aria-live="polite"></section><section class="panel"><form id="node-edit-form" class="form-grid detail-form"><label>节点名称<input name="name" placeholder="节点名称"></label><label>端口<input name="port" type="number" min="1" max="65535" required></label><label>服务器地址<input name="address" placeholder="edge.example.com"></label><label>域名<input name="domain" placeholder="example.com"></label><label>备注<input name="remark" placeholder="备注"></label><label>地区<input name="region" placeholder="地区"></label><label>用途<input name="purpose" placeholder="用途"></label><label>线路<input name="line" placeholder="线路"></label><label>标签<input name="tags" placeholder="a,b"></label><div class="form-actions"><button type="submit" class="primary-button">保存节点</button><a class="secondary-button" id="share-link">查看分享</a></div></form><pre id="node-output" class="output detail-output">读取中…</pre></section></main><script>window.SB_SERVER_ID={{printf "%q" .ServerID}};window.SB_NODE_ID={{printf "%q" .NodeID}};</script><script src="/static/detail.js" defer></script></body></html>
