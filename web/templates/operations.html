<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运维中心 · sb-manager</title><link rel="stylesheet" href="/static/app.css"></head>
<body class="detail-body"><main class="detail-shell"><header class="detail-header"><a href="/">← 返回总览</a><span class="connection-pill"><span class="status-dot online"></span>运维中心</span></header><section class="detail-title"><p class="eyebrow">OPERATIONS</p><h1>运维中心</h1><p class="muted">脚本已有能力统一从这里执行，所有变更仍经过任务、校验和回滚。</p></section><section id="alerts" aria-live="polite"></section><section class="operations-grid"><article class="panel"><div class="panel-header"><div><p class="eyebrow">OBSERVABILITY</p><h2>健康与配置</h2></div><button class="secondary-button" data-read="health">刷新</button></div><div class="operation-actions"><button class="primary-button" data-action="health.check">健康检查</button><button class="secondary-button" data-action="health.enable">启用定时检查</button><button class="secondary-button" data-action="health.disable">停用定时检查</button><button class="secondary-button" data-action="config.validate">验证配置</button><button class="secondary-button" data-action="config.diff">查看配置 Diff</button></div><pre id="health-output" class="output">读取中…</pre></article><article class="panel"><div class="panel-header"><div><p class="eyebrow">NETWORK</p><h2>防火墙与服务</h2></div><button class="secondary-button" data-read="firewall">刷新</button></div><div class="operation-actions"><button class="primary-button" data-action="firewall.ports">查看协议端口</button><button class="secondary-button" data-action="firewall.status">防火墙状态</button><button class="secondary-button" data-action="firewall.ufw-allow">放行协议端口</button><button class="secondary-button" data-action="service.restart">重启服务</button><button class="secondary-button" data-action="repair">安全修复</button></div><pre id="firewall-output" class="output">读取中…</pre></article><article class="panel"><div class="panel-header"><div><p class="eyebrow">TRAFFIC</p><h2>流量统计</h2></div><button class="secondary-button" data-read="traffic">刷新</button></div><form id="traffic-form" class="stack-form"><input name="node_id" placeholder="节点 ID（留空为全部）"><input name="quota" placeholder="配额，例如 100G 或 unlimited"><input name="rate" placeholder="速率，例如 50M 或 unlimited"><input name="reset_day" type="number" min="1" max="28" placeholder="重置日 1-28"><button type="submit" class="primary-button">保存流量策略</button></form><div class="operation-actions"><button class="secondary-button" data-action="traffic.status">刷新统计</button><button class="secondary-button" data-action="traffic.reconcile">重建流量规则</button></div><pre id="traffic-output" class="output">读取中…</pre></article><article class="panel"><div class="panel-header"><div><p class="eyebrow">LOGS</p><h2>日志中心</h2></div><select id="log-target" aria-label="日志目标"><option value="all">全部</option><option value="singbox">sing-box</option><option value="tunnel">Tunnel</option><option value="nginx">Nginx Stream</option></select></div><div class="operation-actions"><button class="primary-button" id="load-logs">读取日志</button><button class="secondary-button" data-action="notify.test">测试通知</button></div><pre id="logs-output" class="output log-output">选择目标后读取日志。</pre></article></section></main><script src="/static/operations.js" defer></script></body></html>
