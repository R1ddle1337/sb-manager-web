name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: make release VERSION="${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/sb-web-linux-amd64
            dist/sb-web-linux-arm64
            dist/sb-web-linux-armv7
            dist/SHA256SUMS
